<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal of Integrative Science Development (JISD) | University of Kabridahar</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased selection:bg-amber-500 selection:text-slate-950">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = "https://lrpcvfytbfkoofxvvbfh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxycGN2Znl0YmZrb29meHZ2YmZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNDcyODQsImV4cCI6MjEwMjgyMzI4NH0.KsfHt7iAaH_mu42RRbazN_-jHrLucKOC1YgNjVCTkTg";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ADMIN_EMAIL = "mekuria.tsegaye20@uok.edu.et";

    function App() {
      const [activeTab, setActiveTab] = useState('published-articles');
      const [currentUser, setCurrentUser] = useState(null);
      const [userProfile, setUserProfile] = useState(null);
      
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [showProfileModal, setShowProfileModal] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [regFullName, setRegFullName] = useState('');
      const [regAffiliation, setRegAffiliation] = useState('University of Kabridahar');
      
      const [editFullName, setEditFullName] = useState('');
      const [editAffiliation, setEditAffiliation] = useState('');
      const [editPassword, setEditPassword] = useState('');

      const [teamEmail, setTeamEmail] = useState('');
      const [teamPassword, setTeamPassword] = useState('');
      const [teamFullName, setTeamFullName] = useState('');
      const [teamAffiliation, setTeamAffiliation] = useState('University of Kabridahar');
      const [teamRole, setTeamRole] = useState('Associate Editor');

      const [authError, setAuthError] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const [submissions, setSubmissions] = useState([]);
      const [userProfilesList, setUserProfilesList] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchTerm, setSearchTerm] = useState('');
      const [editorSearchId, setEditorSearchId] = useState('');
      const [editorTab, setEditorTab] = useState('manuscripts');
      const [expandedAbstracts, setExpandedAbstracts] = useState({});

      const [formData, setFormData] = useState({
        title: '',
        abstract: '',
        keywords: '',
        category: 'Engineering & Technology',
        manuscript_type: 'Original Research',
        declaration: false,
        file: null
      });

      const [coAuthors, setCoAuthors] = useState([]);

      useEffect(() => {
        initSession();
        fetchSubmissions();
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, currentUser, userProfile, showAuthModal, showProfileModal, authMode, submissions, userProfilesList, editorTab, expandedAbstracts]);

      const initSession = async () => {
        const { data: { session } } = await db.auth.getSession();
        if (session?.user) {
          setCurrentUser(session.user);
          await syncProfile(session.user);
        }
      };

      const syncProfile = async (authUser, fallbackName = '', fallbackAffiliation = '') => {
        const userId = authUser.id;
        const email = authUser.email;
        
        let role = (email.toLowerCase() === ADMIN_EMAIL.toLowerCase() || email.toLowerCase() === 'mekuria.t.alemu@gmail.com') ? 'Administrator' : 'Author';

        const { data: existingProfile } = await db.from('profiles').select('*').eq('id', userId).single();

        if (existingProfile) {
          setUserProfile(existingProfile);
          setEditFullName(existingProfile.full_name || '');
          setEditAffiliation(existingProfile.affiliation || '');
        } else {
          const newProfile = {
            id: userId,
            email: email,
            full_name: fallbackName || (email.toLowerCase() === ADMIN_EMAIL.toLowerCase() ? 'Dr. Mekuria Tsegaye' : email.split('@')[0]),
            affiliation: fallbackAffiliation || 'University of Kabridahar',
            role: role
          };

          const { data: createdProfile } = await db.from('profiles').upsert(newProfile).select().single();
          setUserProfile(createdProfile || newProfile);
          setEditFullName(newProfile.full_name);
          setEditAffiliation(newProfile.affiliation);
        }
      };

      const fetchSubmissions = async () => {
        const { data, error } = await db.from('submissions').select('*').order('created_at', { ascending: false });
        if (!error && data) setSubmissions(data);
      };

      const fetchAllProfiles = async () => {
        const { data, error } = await db.from('profiles').select('*').order('created_at', { ascending: false });
        if (!error && data) setUserProfilesList(data);
      };

      const toggleAbstract = (id) => {
        setExpandedAbstracts(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        setIsSubmitting(true);

        const cleanEmail = authEmail.trim();

        try {
          if (authMode === 'login') {
            const { data, error } = await db.auth.signInWithPassword({ email: cleanEmail, password: authPassword });
            if (error) throw error;

            if (data?.user) {
              setCurrentUser(data.user);
              await syncProfile(data.user);
              setShowAuthModal(false);
              await fetchSubmissions();
              setActiveTab('editor-portal');
            }
          } else if (authMode === 'register') {
            const { data, error } = await db.auth.signUp({ email: cleanEmail, password: authPassword });
            if (error) throw error;

            if (data.user) {
              await syncProfile(data.user, regFullName, regAffiliation);
              setCurrentUser(data.user);
              setShowAuthModal(false);
              alert("Registered and signed in successfully!");
            }
          }
        } catch (err) {
          setAuthError(err.message || "Authentication failed.");
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleCreateTeamMember = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);

        try {
          const { data, error } = await db.auth.signUp({ 
            email: teamEmail.trim(), 
            password: teamPassword 
          });

          if (error) throw error;

          if (data.user) {
            const teamProfile = {
              id: data.user.id,
              email: teamEmail.trim(),
              full_name: teamFullName,
              affiliation: teamAffiliation,
              role: teamRole
            };

            await db.from('profiles').upsert(teamProfile);
            alert(`Account created for ${teamFullName} (${teamRole})!`);
            setTeamEmail('');
            setTeamPassword('');
            setTeamFullName('');
            setTeamAffiliation('University of Kabridahar');
            setTeamRole('Associate Editor');
            fetchAllProfiles();
          }
        } catch (err) {
          alert("Error creating staff account: " + err.message);
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleProfileUpdate = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);
        try {
          const updatedData = {
            id: currentUser.id,
            email: currentUser.email,
            full_name: editFullName,
            affiliation: editAffiliation,
            role: userProfile.role
          };

          await db.from('profiles').upsert(updatedData);

          if (editPassword.trim() !== '') {
            await db.auth.updateUser({ password: editPassword });
          }

          setUserProfile({ ...userProfile, full_name: editFullName, affiliation: editAffiliation });
          alert("Profile updated successfully!");
          setShowProfileModal(false);
          setEditPassword('');
        } catch (err) {
          alert("Failed to update profile: " + err.message);
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleLogout = async () => {
        await db.auth.signOut();
        setCurrentUser(null);
        setUserProfile(null);
        setActiveTab('published-articles');
      };

      const handleFormSubmit = async (e) => {
        e.preventDefault();
        if (!currentUser) {
          alert("Please login to submit your manuscript.");
          setShowAuthModal(true);
          return;
        }

        if (!formData.file) {
          alert("Please attach your manuscript document.");
          return;
        }

        setIsSubmitting(true);
        try {
          const file = formData.file;
          const manuscriptId = `JISD-2026-${Math.floor(100 + Math.random() * 900)}`;
          const filePath = `${manuscriptId}_${Date.now()}_${file.name}`;

          const { error: uploadError } = await db.storage.from('manuscripts').upload(filePath, file);
          if (uploadError) throw uploadError;

          const { data: urlData } = db.storage.from('manuscripts').getPublicUrl(filePath);

          const payload = {
            manuscript_id: manuscriptId,
            user_id: currentUser.id,
            author_name: userProfile?.full_name || currentUser.email,
            author_email: currentUser.email,
            affiliation: userProfile?.affiliation || 'University of Kabridahar',
            title: formData.title,
            abstract: formData.abstract,
            keywords: formData.keywords,
            category: formData.category,
            manuscript_type: formData.manuscript_type,
            co_authors: coAuthors,
            declaration_accepted: true,
            file_url: urlData.publicUrl,
            status: 'Submitted'
          };

          const { error: insertError } = await db.from('submissions').insert([payload]);
          if (insertError) throw insertError;

          alert(`Manuscript Submitted Successfully!\nID: ${manuscriptId}`);
          setFormData({ title: '', abstract: '', keywords: '', category: 'Engineering & Technology', manuscript_type: 'Original Research', declaration: false, file: null });
          setCoAuthors([]);
          await fetchSubmissions();
          setActiveTab('author-portal');
        } catch (err) {
          alert("Submission failed: " + err.message);
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleUpdateStatus = async (manuscriptId, status) => {
        const { error } = await db.from('submissions').update({ status }).eq('manuscript_id', manuscriptId);
        if (!error) {
          alert(`Status for ${manuscriptId} updated to: ${status}`);
          fetchSubmissions();
        }
      };

      const publishedArticles = submissions.filter(s => {
        const isPublished = s.status === 'Published';
        const matchesCategory = selectedCategory === 'All' || s.category === selectedCategory;
        const matchesSearch = s.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                              (s.author_name && s.author_name.toLowerCase().includes(searchTerm.toLowerCase()));
        return isPublished && matchesCategory && matchesSearch;
      });

      const isStaffOrAdmin = userProfile && ['Administrator', 'Editor', 'Associate Editor', 'Reviewer'].includes(userProfile.role);

      return (
        <div className="min-h-screen flex flex-col bg-slate-100">
          
          <header className="bg-slate-950 text-white border-b-4 border-amber-500 shadow-md sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
              
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('published-articles')}>
                <div className="flex items-center gap-2">
                  <img src="uok-logo.png" onError={(e) => e.target.style.display='none'} alt="UoK Logo" className="w-10 h-10 object-contain" />
                  <img src="jisd-logo.png" onError={(e) => e.target.style.display='none'} alt="JISD Logo" className="w-10 h-10 object-contain" />
                </div>
                <div>
                  <h1 className="text-base font-extrabold tracking-tight leading-tight">
                    Journal of Integrative Science Development (JISD)
                  </h1>
                  <p className="text-[11px] text-amber-400 font-semibold">
                    University of Kabridahar • RPEDD Directorate
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                {currentUser ? (
                  <div className="flex items-center gap-3 bg-slate-900 border border-slate-700 px-3.5 py-1.5 rounded-md shadow-sm">
                    <div className="text-right">
                      <p className="text-xs font-bold text-amber-400">
                        {userProfile?.full_name || currentUser.email.split('@')[0]}
                      </p>
                      <p className="text-[10px] text-slate-300 font-medium capitalize">
                        {userProfile?.role || 'Author'}
                      </p>
                    </div>

                    <div className="flex items-center gap-1.5 border-l border-slate-700 pl-2.5">
                      <button 
                        onClick={() => setShowProfileModal(true)}
                        className="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 font-semibold px-2.5 py-1 rounded transition flex items-center gap-1"
                      >
                        <i data-lucide="user-cog" className="w-3.5 h-3.5"></i>
                        Settings
                      </button>

                      <button 
                        onClick={handleLogout}
                        className="text-[11px] bg-red-600 hover:bg-red-700 text-white font-semibold px-2.5 py-1 rounded transition flex items-center gap-1"
                      >
                        <i data-lucide="log-out" className="w-3.5 h-3.5"></i>
                        Logout
                      </button>
                    </div>
                  </div>
                ) : (
                  <button 
                    onClick={() => { setAuthMode('login'); setShowAuthModal(true); }}
                    className="flex items-center gap-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold px-4 py-2 rounded shadow transition"
                  >
                    <i data-lucide="lock" className="w-3.5 h-3.5"></i>
                    Portal Login / Register
                  </button>
                )}
              </div>

            </div>
          </header>

          <div className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col md:flex-row gap-6">
            
            <aside className="w-full md:w-60 flex-shrink-0">
              <div className="bg-white rounded-lg shadow-sm border border-slate-200 p-3 space-y-1">
                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-2 mb-1 block">Public Journal</span>
                
                <button
                  onClick={() => setActiveTab('published-articles')}
                  className={`w-full flex items-center gap-2.5 px-3 py-2 text-xs font-semibold rounded-md transition ${
                    activeTab === 'published-articles' ? 'bg-slate-900 text-white' : 'text-slate-700 hover:bg-slate-100'
                  }`}
                >
                  <i data-lucide="book-open" className="w-4 h-4"></i>
                  <span>Published Articles</span>
                </button>

                <button
                  onClick={() => setActiveTab('about-journal')}
                  className={`w-full flex items-center gap-2.5 px-3 py-2 text-xs font-semibold rounded-md transition ${
                    activeTab === 'about-journal' ? 'bg-slate-900 text-white' : 'text-slate-700 hover:bg-slate-100'
                  }`}
                >
                  <i data-lucide="info" className="w-4 h-4"></i>
                  <span>About JISD</span>
                </button>

                <button
                  onClick={() => setActiveTab('editorial-board')}
                  className={`w-full flex items-center gap-2.5 px-3 py-2 text-xs font-semibold rounded-md transition ${
                    activeTab === 'editorial-board' ? 'bg-slate-900 text-white' : 'text-slate-700 hover:bg-slate-100'
                  }`}
                >
                  <i data-lucide="users" className="w-4 h-4"></i>
                  <span>Editorial Board</span>
                </button>

                <div className="pt-3 mt-3 border-t border-slate-200">
                  <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-2 mb-1 block">Workspaces</span>
                  
                  <button
                    onClick={() => setActiveTab('submit-paper')}
                    className={`w-full flex items-center gap-2.5 px-3 py-2 text-xs font-semibold rounded-md transition ${
                      activeTab === 'submit-paper' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-700 hover:bg-slate-100'
                    }`}
                  >
                    <i data-lucide="upload-cloud" className="w-4 h-4"></i>
                    <span>Submit Manuscript</span>
                  </button>

                  {currentUser && (
                    <>
                      <button
                        onClick={() => setActiveTab('author-portal')}
                        className={`w-full flex items-center gap-2.5 px-3 py-2 text-xs font-semibold rounded-md transition mt-1 ${
                          activeTab === 'author-portal' ? 'bg-slate-900 text-white' : 'text-slate-700 hover:bg-slate-100'
                        }`}
                      >
                        <i data-lucide="layout-dashboard" className="w-4 h-4"></i>
                        <span>Author Submissions</span>
                      </button>

                      {isStaffOrAdmin && (
                        <button
                          onClick={() => { setActiveTab('editor-portal'); fetchAllProfiles(); fetchSubmissions(); }}
                          className={`w-full flex items-center gap-2.5 px-3 py-2 text-xs font-bold rounded-md transition mt-2 ${
                            activeTab === 'editor-portal' ? 'bg-emerald-700 text-white' : 'bg-emerald-50 text-emerald-800 hover:bg-emerald-100'
                          }`}
                        >
                          <i data-lucide="shield" className="w-4 h-4"></i>
                          <span>Editorial Control Panel</span>
                        </button>
                      )}
                    </>
                  )}
                </div>
              </div>
            </aside>

            <main className="flex-1">

              {activeTab === 'published-articles' && (
                <div className="space-y-4">
                  <div className="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b pb-2 mb-4 gap-2">
                      <div>
                        <h2 className="text-lg font-bold text-slate-900">Published Research Articles</h2>
                        <p className="text-xs text-slate-500">Peer-reviewed open-access repository</p>
                      </div>
                    </div>
                    
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                      <div className="sm:col-span-2">
                        <input 
                          type="text" 
                          placeholder="Search title or author..." 
                          value={searchTerm}
                          onChange={e => setSearchTerm(e.target.value)}
                          className="w-full p-2 text-xs border rounded outline-none focus:ring-2 focus:ring-slate-900"
                        />
                      </div>
                      <div>
                        <select 
                          value={selectedCategory} 
                          onChange={e => setSelectedCategory(e.target.value)}
                          className="w-full p-2 text-xs border rounded bg-white font-medium"
                        >
                          <option value="All">All Disciplines</option>
                          <option value="Engineering & Technology">Engineering & Technology</option>
                          <option value="Business & Economics">Business & Economics</option>
                          <option value="Natural & Computational Sciences">Natural & Computational Sciences</option>
                          <option value="Social Sciences & Humanities">Social Sciences & Humanities</option>
                          <option value="Health Sciences">Health Sciences</option>
                        </select>
                      </div>
                    </div>

                    <div className="space-y-4">
                      {publishedArticles.length === 0 ? (
                        <div className="p-8 text-center text-slate-500 bg-slate-50 border rounded text-xs">
                          No published articles match your search criteria.
                        </div>
                      ) : (
                        publishedArticles.map(article => {
                          const isExpanded = expandedAbstracts[article.id];
                          const abstractText = article.abstract || '';
                          const isLongText = abstractText.length > 220;

                          return (
                            <div key={article.id} className="p-4 border-l-4 border-amber-500 border-y border-r rounded-r bg-white shadow-sm space-y-2">
                              <h3 className="text-base font-bold text-slate-900">{article.title}</h3>
                              <p className="text-xs text-slate-600 font-medium">Author: {article.author_name} ({article.affiliation})</p>
                              
                              <div className="text-xs text-slate-700 bg-slate-50 p-3 rounded border border-slate-100">
                                <p className="leading-relaxed">
                                  {isExpanded || !isLongText 
                                    ? abstractText 
                                    : `${abstractText.substring(0, 220)}...`}
                                </p>

                                {isLongText && (
                                  <button 
                                    onClick={() => toggleAbstract(article.id)}
                                    className="mt-2 text-amber-600 hover:text-amber-700 font-bold text-[11px] underline block focus:outline-none"
                                  >
                                    {isExpanded ? "Show Less" : "Read More..."}
                                  </button>
                                )}
                              </div>

                              <a 
                                href={article.file_url} 
                                target="_blank" 
                                rel="noreferrer" 
                                className="inline-block bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-3 py-1.5 rounded transition"
                              >
                                Download PDF
                              </a>
                            </div>
                          );
                        })
                      )}
                    </div>

                  </div>
                </div>
              )}

              {activeTab === 'about-journal' && (
                <div className="bg-white p-6 rounded-lg shadow-sm border border-slate-200 space-y-4 text-xs leading-relaxed">
                  <h2 className="text-lg font-bold text-slate-900 border-b pb-2">About JISD</h2>
                  <p>The <strong>Journal of Integrative Science Development (JISD)</strong> is an official publication of the <strong>University of Kabridahar</strong>.</p>
                </div>
              )}

              {activeTab === 'editorial-board' && (
                <div className="bg-white p-6 rounded-lg shadow-sm border border-slate-200 space-y-4 text-xs">
                  <h2 className="text-lg font-bold text-slate-900 border-b pb-2">Editorial Board</h2>
                  <div className="p-3 bg-slate-50 border rounded">
                    <h3 className="font-bold text-sm text-slate-900">Editor-in-Chief & Administrator</h3>
                    <p className="text-slate-700 font-semibold">Dr. Mekuria Tsegaye</p>
                    <p className="text-slate-500">University of Kabridahar • mekuria.tsegaye20@uok.edu.et</p>
                  </div>
                </div>
              )}

              {activeTab === 'submit-paper' && (
                <div className="bg-white p-6 rounded-lg shadow-sm border border-slate-200">
                  <h2 className="text-lg font-bold text-slate-900 border-b pb-2 mb-4">Submit Your Manuscript</h2>
                  
                  {!currentUser ? (
                    <div className="bg-amber-50 border border-amber-200 rounded p-4 text-xs text-amber-900 space-y-2">
                      <p className="font-bold">Login Required</p>
                      <button onClick={() => { setAuthMode('login'); setShowAuthModal(true); }} className="bg-amber-600 text-white font-bold px-3 py-1.5 rounded">
                        Login Now
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={handleFormSubmit} className="space-y-4 text-xs">
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Manuscript Title *</label>
                        <input type="text" required value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} className="w-full p-2.5 border rounded" />
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block font-bold text-slate-700 mb-1">Discipline *</label>
                          <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full p-2.5 border rounded bg-white">
                            <option>Engineering & Technology</option>
                            <option>Business & Economics</option>
                            <option>Natural & Computational Sciences</option>
                            <option>Social Sciences & Humanities</option>
                            <option>Health Sciences</option>
                          </select>
                        </div>
                        <div>
                          <label className="block font-bold text-slate-700 mb-1">Type *</label>
                          <select value={formData.manuscript_type} onChange={e => setFormData({...formData, manuscript_type: e.target.value})} className="w-full p-2.5 border rounded bg-white">
                            <option>Original Research</option>
                            <option>Review Article</option>
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Abstract *</label>
                        <textarea rows="4" required value={formData.abstract} onChange={e => setFormData({...formData, abstract: e.target.value})} className="w-full p-2.5 border rounded"></textarea>
                      </div>

                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Keywords *</label>
                        <input type="text" required value={formData.keywords} onChange={e => setFormData({...formData, keywords: e.target.value})} className="w-full p-2.5 border rounded" />
                      </div>

                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Manuscript File *</label>
                        <input type="file" required onChange={e => setFormData({...formData, file: e.target.files[0]})} className="w-full p-2 border rounded bg-white" />
                      </div>

                      <button type="submit" disabled={isSubmitting} className="bg-slate-900 text-white font-bold px-6 py-2.5 rounded">
                        {isSubmitting ? "Uploading..." : "Submit Manuscript"}
                      </button>
                    </form>
                  )}
                </div>
              )}

              {activeTab === 'author-portal' && currentUser && (
                <div className="bg-white p-6 rounded-lg shadow-sm border border-slate-200">
                  <h2 className="text-lg font-bold text-slate-900 border-b pb-2 mb-4">Your Submissions</h2>
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="border-b bg-slate-50">
                        <th className="p-2.5">ID</th>
                        <th className="p-2.5">Title</th>
                        <th className="p-2.5">Status</th>
                      </tr>
                    </thead>
                    <tbody>
                      {submissions.filter(s => s.user_id === currentUser.id).map(sub => (
                        <tr key={sub.id} className="border-b">
                          <td className="p-2.5 font-bold">{sub.manuscript_id}</td>
                          <td className="p-2.5">{sub.title}</td>
                          <td className="p-2.5">{sub.status}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {activeTab === 'editor-portal' && isStaffOrAdmin && (
                <div className="bg-white p-6 rounded-lg shadow-sm border border-emerald-300 space-y-4">
                  <div className="flex justify-between items-center border-b pb-3">
                    <div>
                      <h2 className="text-lg font-bold text-emerald-950">Editorial Control Panel</h2>
                      <p className="text-xs text-emerald-700">Administrator Access: <strong>{userProfile?.full_name}</strong></p>
                    </div>

                    <div className="flex bg-slate-100 p-1 rounded border text-xs font-bold">
                      <button 
                        onClick={() => setEditorTab('manuscripts')}
                        className={`px-3 py-1 rounded ${editorTab === 'manuscripts' ? 'bg-emerald-700 text-white' : 'text-slate-600'}`}
                      >
                        All Manuscripts ({submissions.length})
                      </button>
                      <button 
                        onClick={() => { setEditorTab('team'); fetchAllProfiles(); }}
                        className={`px-3 py-1 rounded ${editorTab === 'team' ? 'bg-emerald-700 text-white' : 'text-slate-600'}`}
                      >
                        Team & Users
                      </button>
                    </div>
                  </div>

                  {editorTab === 'manuscripts' && (
                    <div className="space-y-3">
                      <input 
                        type="text" 
                        placeholder="Filter by Manuscript ID..." 
                        value={editorSearchId}
                        onChange={e => setEditorSearchId(e.target.value)}
                        className="w-64 p-2 text-xs border border-emerald-400 rounded"
                      />

                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs border-collapse">
                          <thead>
                            <tr className="border-b bg-emerald-50 text-emerald-950">
                              <th className="p-2.5">Manuscript ID</th>
                              <th className="p-2.5">Title & Author Details</th>
                              <th className="p-2.5">Attachment</th>
                              <th className="p-2.5">Update Status</th>
                            </tr>
                          </thead>
                          <tbody>
                            {submissions.length === 0 ? (
                              <tr>
                                <td colSpan="4" className="p-6 text-center text-slate-500 font-semibold">
                                  No submissions found in database.
                                </td>
                              </tr>
                            ) : (
                              submissions.filter(s => editorSearchId.trim() === '' || s.manuscript_id.toLowerCase().includes(editorSearchId.trim().toLowerCase())).map(s => (
                                <tr key={s.id} className="border-b hover:bg-slate-50">
                                  <td className="p-2.5 font-bold text-slate-900">{s.manuscript_id}</td>
                                  <td className="p-2.5">
                                    <strong className="text-slate-900">{s.title}</strong><br/>
                                    <span className="text-slate-500">{s.author_name} ({s.author_email})</span>
                                  </td>
                                  <td className="p-2.5">
                                    <a href={s.file_url} target="_blank" rel="noreferrer" className="bg-slate-800 hover:bg-slate-700 text-white px-2.5 py-1 rounded text-[10px] font-bold inline-block">
                                      Download PDF
                                    </a>
                                  </td>
                                  <td className="p-2.5">
                                    <select 
                                      value={s.status} 
                                      onChange={e => handleUpdateStatus(s.manuscript_id, e.target.value)}
                                      className="p-1 border rounded text-xs font-semibold bg-white"
                                    >
                                      <option value="Submitted">Submitted</option>
                                      <option value="Under Review">Under Review</option>
                                      <option value="Revision Requested">Revision Requested</option>
                                      <option value="Accepted">Accepted</option>
                                      <option value="Published">Published</option>
                                      <option value="Rejected">Rejected</option>
                                    </select>
                                  </td>
                                </tr>
                              ))
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {editorTab === 'team' && (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 text-xs">
                      <div className="bg-slate-50 p-4 border rounded space-y-3">
                        <h3 className="font-bold border-b pb-1">Create Staff Account</h3>
                        <form onSubmit={handleCreateTeamMember} className="space-y-2">
                          <div>
                            <label className="block font-bold">Role</label>
                            <select value={teamRole} onChange={e => setTeamRole(e.target.value)} className="w-full p-2 border rounded bg-white">
                              <option value="Associate Editor">Associate Editor</option>
                              <option value="Reviewer">Reviewer</option>
                              <option value="Editor">Editor</option>
                            </select>
                          </div>
                          <div>
                            <label className="block font-bold">Full Name</label>
                            <input type="text" required value={teamFullName} onChange={e => setTeamFullName(e.target.value)} className="w-full p-2 border rounded" />
                          </div>
                          <div>
                            <label className="block font-bold">Affiliation</label>
                            <input type="text" required value={teamAffiliation} onChange={e => setTeamAffiliation(e.target.value)} className="w-full p-2 border rounded" />
                          </div>
                          <div>
                            <label className="block font-bold">Email</label>
                            <input type="email" required value={teamEmail} onChange={e => setTeamEmail(e.target.value)} className="w-full p-2 border rounded" />
                          </div>
                          <div>
                            <label className="block font-bold">Password</label>
                            <input type="password" required value={teamPassword} onChange={e => setTeamPassword(e.target.value)} className="w-full p-2 border rounded" />
                          </div>
                          <button type="submit" disabled={isSubmitting} className="w-full bg-emerald-800 text-white font-bold py-2 rounded">
                            Create Account
                          </button>
                        </form>
                      </div>

                      <div className="md:col-span-2 space-y-2">
                        <h3 className="font-bold border-b pb-1">All System Accounts</h3>
                        <div className="overflow-x-auto border rounded">
                          <table className="w-full text-left text-xs border-collapse">
                            <thead>
                              <tr className="bg-slate-100 border-b font-bold">
                                <th className="p-2">Name</th>
                                <th className="p-2">Role</th>
                                <th className="p-2">Email</th>
                              </tr>
                            </thead>
                            <tbody>
                              {userProfilesList.map(prof => (
                                <tr key={prof.id} className="border-b">
                                  <td className="p-2 font-bold">{prof.full_name}</td>
                                  <td className="p-2">{prof.role}</td>
                                  <td className="p-2 font-mono">{prof.email}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}

                </div>
              )}

            </main>
          </div>

          {showAuthModal && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-lg shadow-2xl w-full max-w-sm p-6 border border-slate-200">
                <div className="flex border-b mb-4 text-xs font-bold">
                  <button onClick={() => setAuthMode('login')} className={`flex-1 pb-2 text-center ${authMode === 'login' ? 'border-b-2 border-slate-900' : 'text-slate-400'}`}>Sign In</button>
                  <button onClick={() => setAuthMode('register')} className={`flex-1 pb-2 text-center ${authMode === 'register' ? 'border-b-2 border-slate-900' : 'text-slate-400'}`}>Register</button>
                </div>

                {authError && <div className="mb-3 text-xs bg-red-50 text-red-700 p-2 rounded">{authError}</div>}

                <form onSubmit={handleAuthSubmit} className="space-y-3 text-xs">
                  {authMode === 'register' && (
                    <>
                      <div>
                        <label className="block font-bold mb-1">Full Name *</label>
                        <input type="text" required value={regFullName} onChange={e => setRegFullName(e.target.value)} className="w-full p-2 border rounded" />
                      </div>
                      <div>
                        <label className="block font-bold mb-1">Affiliation *</label>
                        <input type="text" required value={regAffiliation} onChange={e => setRegAffiliation(e.target.value)} className="w-full p-2 border rounded" />
                      </div>
                    </>
                  )}

                  <div>
                    <label className="block font-bold mb-1">Email Address *</label>
                    <input type="email" required value={authEmail} onChange={e => setAuthEmail(e.target.value)} className="w-full p-2 border rounded" placeholder="mekuria.tsegaye20@uok.edu.et" />
                  </div>
                  <div>
                    <label className="block font-bold mb-1">Password *</label>
                    <input type="password" required value={authPassword} onChange={e => setAuthPassword(e.target.value)} className="w-full p-2 border rounded" placeholder="••••••••" />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowAuthModal(false)} className="px-3 py-1.5 text-slate-500 rounded text-xs font-semibold">Cancel</button>
                    <button type="submit" disabled={isSubmitting} className="bg-slate-950 text-white px-4 py-1.5 rounded text-xs font-bold">
                      {isSubmitting ? "Signing in..." : "Sign In"}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showProfileModal && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-lg shadow-2xl w-full max-w-sm p-6 border border-slate-200">
                <h3 className="text-sm font-bold text-slate-900 border-b pb-2 mb-4">Edit Profile</h3>
                <form onSubmit={handleProfileUpdate} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold mb-1">Full Name *</label>
                    <input type="text" required value={editFullName} onChange={e => setEditFullName(e.target.value)} className="w-full p-2 border rounded" />
                  </div>
                  <div>
                    <label className="block font-bold mb-1">Affiliation *</label>
                    <input type="text" required value={editAffiliation} onChange={e => setEditAffiliation(e.target.value)} className="w-full p-2 border rounded" />
                  </div>
                  <div>
                    <label className="block font-bold mb-1">New Password (Optional)</label>
                    <input type="password" value={editPassword} onChange={e => setEditPassword(e.target.value)} placeholder="••••••••" className="w-full p-2 border rounded" />
                  </div>
                  <div className="flex justify-end gap-2 pt-3">
                    <button type="button" onClick={() => setShowProfileModal(false)} className="px-3 py-1.5 text-slate-500 rounded text-xs">Cancel</button>
                    <button type="submit" disabled={isSubmitting} className="bg-amber-500 text-slate-950 px-4 py-1.5 rounded text-xs font-bold">Save</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="bg-slate-950 text-slate-400 text-xs py-6 border-t-4 border-amber-500 mt-auto">
            <div className="max-w-7xl mx-auto px-4 text-center space-y-1">
              <p className="text-slate-200 font-bold">University of Kabridahar • RPEDD Directorate</p>
              <p>© 2026 Journal of Integrative Science Development (JISD)</p>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
