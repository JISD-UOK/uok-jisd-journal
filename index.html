<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal of Integrative Science Development (JISD)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('published-articles');
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [isSendingEmail, setIsSendingEmail] = useState(false);

      // Raw assets path
      const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/your-username/your-repo/main";

      // Submissions & Published Articles State
      const [submissions, setSubmissions] = useState([
        {
          id: '1',
          manuscript_id: 'JISD-2026-101',
          title: 'Assessment of Groundwater Potential in the Lower Wabi Shebelle Basin',
          abstract: 'This study presents a spatial assessment of groundwater potential using GIS and remote sensing integration in the Wabi Shebelle basin of Eastern Ethiopia.',
          category: 'Engineering & Technology',
          manuscript_type: 'Original Research',
          author_name: 'Dr. Ahmed Hassan',
          author_email: 'ahmed.hassan@uok.edu.et',
          status: 'Published',
          doi: '10.5281/jisd.2026.101',
          volume: 1,
          issue: 1,
          publication_year: 2026,
          submitted_at: '2026-03-15'
        },
        {
          id: '2',
          manuscript_id: 'JISD-2026-102',
          title: 'Impacts of Pastoral Microfinance Schemes on Household Resilience',
          abstract: 'An empirical analysis evaluating microfinance interventions across nomadic communities in the Somali Regional State.',
          category: 'Business & Economics',
          manuscript_type: 'Original Research',
          author_name: 'Fatuma Abdi, MSc',
          author_email: 'fatuma.abdi@uok.edu.et',
          status: 'Published',
          doi: '10.5281/jisd.2026.102',
          volume: 1,
          issue: 1,
          publication_year: 2026,
          submitted_at: '2026-04-10'
        }
      ]);

      // Form State
      const [formData, setFormData] = useState({
        title: '',
        abstract: '',
        keywords: '',
        category: 'Natural & Computational Sciences',
        manuscript_type: 'Original Research',
        author_name: '',
        author_email: '',
        file: null
      });

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, currentUser, showLoginModal, submissions, selectedCategory, searchQuery, isSendingEmail]);

      // Email Notification Dispatcher (Resend API Integration)
      const sendEmailNotification = async (submissionData) => {
        setIsSendingEmail(true);
        try {
          // Replace with your active Resend API or Supabase Function endpoint
          console.log("Sending email confirmation to:", submissionData.author_email);
          
          /*
          await fetch('https://api.resend.com/emails', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer YOUR_RESEND_API_KEY'
            },
            body: JSON.stringify({
              from: 'JISD Journal <jisd@uok.edu.et>',
              to: submissionData.author_email,
              subject: `Manuscript Received: ${submissionData.manuscript_id}`,
              html: `<p>Dear ${submissionData.author_name},</p><p>Thank you for submitting <strong>"${submissionData.title}"</strong> to JISD. Your Manuscript Tracking ID is <strong>${submissionData.manuscript_id}</strong>.</p>`
            })
          });
          */
        } catch (err) {
          console.error("Email dispatch failed:", err);
        } finally {
          setIsSendingEmail(false);
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (loginEmail === 'mekuria.tsegaye20@uok.edu.et' && loginPassword === 'Editor@123') {
          setCurrentUser({
            name: 'Dr. Mekuria Tsegaye',
            email: 'mekuria.tsegaye20@uok.edu.et',
            role: 'Editor'
          });
          setShowLoginModal(false);
          setLoginError('');
          setLoginEmail('');
          setLoginPassword('');
          setActiveTab('editor-dashboard');
        } else {
          setLoginError('Invalid credentials. Use mekuria.tsegaye20@uok.edu.et / Editor@123');
        }
      };

      const handleFormSubmit = async (e) => {
        e.preventDefault();
        const manuscriptId = `JISD-2026-${Math.floor(Math.random() * 899 + 100)}`;
        const newSub = {
          id: Date.now().toString(),
          manuscript_id: manuscriptId,
          title: formData.title,
          abstract: formData.abstract,
          category: formData.category,
          manuscript_type: formData.manuscript_type,
          author_name: formData.author_name,
          author_email: formData.author_email,
          status: 'Submitted',
          doi: `10.5281/jisd.2026.${Math.floor(Math.random() * 899 + 100)}`,
          volume: 1,
          issue: 1,
          publication_year: 2026,
          submitted_at: new Date().toISOString().split('T')[0]
        };

        setSubmissions([newSub, ...submissions]);
        await sendEmailNotification(newSub);

        alert(`Manuscript submitted successfully!\n\nID: ${newSub.manuscript_id}\nA confirmation email has been dispatched to ${newSub.author_email}.`);
        
        setFormData({
          title: '', abstract: '', keywords: '', category: 'Natural & Computational Sciences',
          manuscript_type: 'Original Research', author_name: '', author_email: '', file: null
        });
        setActiveTab('track-manuscript');
      };

      const updateStatus = (id, newStatus) => {
        setSubmissions(submissions.map(s => s.id === id ? { ...s, status: newStatus } : s));
      };

      const boardMembers = [
        {
          name: "Dr. Mekuria Tsegaye",
          role: "Editor-in-Chief",
          affiliation: "University of Kabridahar, Ethiopia",
          email: "mekuria.tsegaye20@uok.edu.et",
          image: `${GITHUB_RAW_BASE}/meku.jpg`,
          bio: "Directs publication strategy, editorial policies, and review management."
        },
        {
          name: "Mahamed Abdi Wali",
          role: "RPEDD Director & Board Chair",
          affiliation: "University of Kabridahar, Ethiopia",
          email: "rpedd@uok.edu.et",
          image: null,
          bio: "Leads research publication dissemination across university faculties."
        },
        {
          name: "Latamo Lameso Lelamo",
          role: "Associate Editor / Officer",
          affiliation: "University of Kabridahar, Ethiopia",
          email: "latamo@uok.edu.et",
          image: null,
          bio: "Oversees double-blind review workflow and copyediting procedures."
        }
      ];

      const publishedArticles = submissions.filter(s => {
        const matchesCategory = selectedCategory === 'All' || s.category === selectedCategory;
        const matchesSearch = s.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              s.abstract.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              s.author_name.toLowerCase().includes(searchQuery.toLowerCase());
        return s.status === 'Published' && matchesCategory && matchesSearch;
      });

      return (
        <div className="min-h-screen flex flex-col bg-gray-100">
          
          {/* HEADER WITH ORIGINAL LOGOS */}
          <header className="bg-white border-b-2 border-blue-900 shadow-md">
            <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              
              {/* Left Logo: University */}
              <div className="flex items-center gap-3">
                <img 
                  src={`${GITHUB_RAW_BASE}/uok-logo.png`} 
                  alt="University Logo" 
                  onError={(e) => { e.target.src = "https://via.placeholder.com/60?text=UOK"; }}
                  className="h-16 w-auto object-contain"
                />
                <div>
                  <h1 className="text-xl font-bold text-blue-950 leading-tight">
                    Journal of Integrative Science Development
                  </h1>
                  <p className="text-xs text-blue-800 font-medium">
                    University of Kabridahar • RPEDD Directorate
                  </p>
                </div>
              </div>

              {/* Right Logo: JISD Journal Logo */}
              <div className="flex items-center gap-4">
                <img 
                  src={`${GITHUB_RAW_BASE}/jisd-logo.png`} 
                  alt="JISD Logo" 
                  onError={(e) => { e.target.src = "https://via.placeholder.com/60?text=JISD"; }}
                  className="h-16 w-auto object-contain hidden sm:block"
                />
                
                {currentUser ? (
                  <div className="bg-blue-50 border border-blue-200 px-3 py-1.5 rounded-md flex items-center gap-2">
                    <span className="text-xs font-bold text-blue-900">{currentUser.name}</span>
                    <button 
                      onClick={() => { setCurrentUser(null); setActiveTab('published-articles'); }}
                      className="text-[10px] bg-red-600 hover:bg-red-700 text-white font-bold px-2 py-0.5 rounded"
                    >
                      Logout
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={() => setShowLoginModal(true)}
                    className="flex items-center gap-1.5 bg-blue-900 hover:bg-blue-800 text-white text-xs font-bold px-4 py-2 rounded shadow"
                  >
                    <i data-lucide="lock" className="w-3.5 h-3.5"></i>
                    Editor Login
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* MAIN LAYOUT */}
          <div className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col md:flex-row gap-6">
            
            {/* SIDEBAR NAVIGATION */}
            <aside className="w-full md:w-60 flex-shrink-0">
              <div className="bg-white rounded-md shadow-sm border border-gray-200 p-3 space-y-1">
                <span className="text-[11px] font-bold text-gray-400 uppercase px-2 mb-1 block">Navigation</span>
                
                {[
                  { id: 'published-articles', label: 'Published Articles', icon: 'book-open' },
                  { id: 'about', label: 'About JISD', icon: 'info' },
                  { id: 'editorial-board', label: 'Editorial Board', icon: 'users' },
                  { id: 'aims-scope', label: 'Aims & Scope', icon: 'target' },
                  { id: 'ethics-policy', label: 'Publication Ethics', icon: 'shield-check' },
                  { id: 'author-guidelines', label: 'Author Guidelines', icon: 'file-text' },
                  { id: 'apc-info', label: 'Processing Charges', icon: 'dollar-sign' },
                  { id: 'review-process', label: 'Review Timeline', icon: 'clock' },
                ].map(nav => (
                  <button
                    key={nav.id}
                    onClick={() => setActiveTab(nav.id)}
                    className={`w-full flex items-center gap-2.5 px-3 py-2 text-xs font-semibold rounded transition ${
                      activeTab === nav.id ? 'bg-blue-900 text-white' : 'text-gray-700 hover:bg-gray-100'
                    }`}
                  >
                    <i data-lucide={nav.icon} className="w-4 h-4"></i>
                    <span>{nav.label}</span>
                  </button>
                ))}

                <div className="pt-3 mt-3 border-t border-gray-100">
                  <span className="text-[11px] font-bold text-gray-400 uppercase px-2 mb-1 block">Author Portal</span>
                  
                  <button
                    onClick={() => setActiveTab('submit-paper')}
                    className={`w-full flex items-center gap-2.5 px-3 py-2 text-xs font-semibold rounded transition ${
                      activeTab === 'submit-paper' ? 'bg-blue-900 text-white' : 'text-gray-700 hover:bg-gray-100'
                    }`}
                  >
                    <i data-lucide="upload-cloud" className="w-4 h-4"></i>
                    <span>Submit Manuscript</span>
                  </button>

                  <button
                    onClick={() => setActiveTab('track-manuscript')}
                    className={`w-full flex items-center gap-2.5 px-3 py-2 text-xs font-semibold rounded transition ${
                      activeTab === 'track-manuscript' ? 'bg-blue-900 text-white' : 'text-gray-700 hover:bg-gray-100'
                    }`}
                  >
                    <i data-lucide="search" className="w-4 h-4"></i>
                    <span>Track Status</span>
                  </button>

                  {currentUser?.role === 'Editor' && (
                    <button
                      onClick={() => setActiveTab('editor-dashboard')}
                      className={`w-full flex items-center gap-2.5 px-3 py-2 text-xs font-bold rounded transition mt-2 ${
                        activeTab === 'editor-dashboard' ? 'bg-emerald-700 text-white' : 'bg-emerald-50 text-emerald-800 hover:bg-emerald-100'
                      }`}
                    >
                      <i data-lucide="sliders" className="w-4 h-4"></i>
                      <span>Editor Control Panel</span>
                    </button>
                  )}
                </div>
              </div>
            </aside>

            {/* DYNAMIC MAIN CONTENT */}
            <main className="flex-1">

              {/* View: Published Articles */}
              {activeTab === 'published-articles' && (
                <div className="bg-white p-6 rounded-md shadow-sm border border-gray-200">
                  <div className="border-b pb-4 mb-4 flex justify-between items-center">
                    <div>
                      <h2 className="text-xl font-bold text-gray-900">Published Research Articles</h2>
                      <p className="text-xs text-gray-500">Open-access peer-reviewed papers</p>
                    </div>
                    <span className="text-xs bg-blue-100 text-blue-900 font-bold px-3 py-1 rounded">
                      Vol. 1 Issue 1 (2026)
                    </span>
                  </div>

                  {/* Search and Category Filter */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
                    <input 
                      type="text"
                      placeholder="Search title, abstract, or author..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="md:col-span-2 text-xs p-2 border rounded focus:ring-2 focus:ring-blue-900 outline-none"
                    />
                    <select
                      value={selectedCategory}
                      onChange={(e) => setSelectedCategory(e.target.value)}
                      className="text-xs p-2 border rounded bg-white focus:ring-2 focus:ring-blue-900 outline-none"
                    >
                      <option value="All">All Categories</option>
                      <option value="Social Sciences & Humanities">Social Sciences & Humanities</option>
                      <option value="Natural & Computational Sciences">Natural & Computational Sciences</option>
                      <option value="Business & Economics">Business & Economics</option>
                      <option value="Engineering & Technology">Engineering & Technology</option>
                      <option value="Health Sciences">Health Sciences</option>
                    </select>
                  </div>

                  <div className="space-y-4">
                    {publishedArticles.length === 0 ? (
                      <p className="text-xs text-gray-500 text-center py-8">No articles found.</p>
                    ) : (
                      publishedArticles.map(article => (
                        <div key={article.id} className="p-4 border rounded hover:border-blue-900 transition bg-white">
                          <div className="flex gap-2 mb-1.5 flex-wrap">
                            <span className="text-[10px] bg-blue-100 text-blue-900 font-bold px-2 py-0.5 rounded">
                              {article.category}
                            </span>
                            <span className="text-[10px] text-gray-500 font-mono">DOI: {article.doi}</span>
                          </div>
                          <h3 className="text-sm font-bold text-gray-900 hover:text-blue-900 cursor-pointer">
                            {article.title}
                          </h3>
                          <p className="text-xs text-blue-950 font-semibold my-1">
                            Authors: {article.author_name} ({article.author_email})
                          </p>
                          <p className="text-xs text-gray-600 line-clamp-3 mb-3">{article.abstract}</p>
                          <div className="flex justify-between items-center text-xs pt-2 border-t">
                            <span className="text-gray-400">Published: {article.submitted_at}</span>
                            <button className="text-blue-900 font-bold hover:underline flex items-center gap-1">
                              <i data-lucide="download" className="w-3.5 h-3.5"></i> PDF Full-Text
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              )}

              {/* View: Editorial Board */}
              {activeTab === 'editorial-board' && (
                <div className="bg-white p-6 rounded-md shadow-sm border border-gray-200">
                  <h2 className="text-xl font-bold text-gray-900 border-b pb-3 mb-6">Editorial Board</h2>
                  <div className="grid grid-cols-1 gap-4">
                    {boardMembers.map((member, idx) => (
                      <div key={idx} className="flex flex-col sm:flex-row gap-4 p-4 border rounded bg-gray-50">
                        <img 
                          src={member.image || "https://via.placeholder.com/100?text=Board"} 
                          alt={member.name}
                          onError={(e) => { e.target.src = "https://ui-avatars.com/api/?name=" + encodeURIComponent(member.name); }}
                          className="w-20 h-20 rounded object-cover border-2 border-blue-900"
                        />
                        <div>
                          <h3 className="text-sm font-bold text-gray-900">{member.name}</h3>
                          <span className="text-xs font-bold text-blue-900 bg-blue-100 px-2 py-0.5 rounded inline-block my-1">
                            {member.role}
                          </span>
                          <p className="text-xs text-gray-600">{member.affiliation}</p>
                          <p className="text-xs text-blue-700">{member.email}</p>
                          <p className="text-xs text-gray-500 italic mt-1">{member.bio}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* View: Manuscript Submission */}
              {activeTab === 'submit-paper' && (
                <div className="bg-white p-6 rounded-md shadow-sm border border-gray-200">
                  <h2 className="text-xl font-bold text-gray-900 border-b pb-3 mb-4">Submit Manuscript</h2>
                  <form onSubmit={handleFormSubmit} className="space-y-4 text-xs">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block font-bold mb-1">Author Full Name</label>
                        <input 
                          type="text" required value={formData.author_name}
                          onChange={e => setFormData({...formData, author_name: e.target.value})}
                          className="w-full p-2 border rounded focus:ring-1 focus:ring-blue-900" 
                        />
                      </div>
                      <div>
                        <label className="block font-bold mb-1">Author Email</label>
                        <input 
                          type="email" required value={formData.author_email}
                          onChange={e => setFormData({...formData, author_email: e.target.value})}
                          className="w-full p-2 border rounded focus:ring-1 focus:ring-blue-900" 
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block font-bold mb-1">Manuscript Title</label>
                      <input 
                        type="text" required value={formData.title}
                        onChange={e => setFormData({...formData, title: e.target.value})}
                        className="w-full p-2 border rounded focus:ring-1 focus:ring-blue-900" 
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block font-bold mb-1">Category</label>
                        <select 
                          value={formData.category}
                          onChange={e => setFormData({...formData, category: e.target.value})}
                          className="w-full p-2 border rounded bg-white"
                        >
                          <option>Social Sciences & Humanities</option>
                          <option>Natural & Computational Sciences</option>
                          <option>Business & Economics</option>
                          <option>Engineering & Technology</option>
                          <option>Health Sciences</option>
                        </select>
                      </div>
                      <div>
                        <label className="block font-bold mb-1">Type</label>
                        <select 
                          value={formData.manuscript_type}
                          onChange={e => setFormData({...formData, manuscript_type: e.target.value})}
                          className="w-full p-2 border rounded bg-white"
                        >
                          <option>Original Research</option>
                          <option>Review Article</option>
                          <option>Short Communication</option>
                          <option>Case Report</option>
                          <option>Policy Brief</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block font-bold mb-1">Abstract</label>
                      <textarea 
                        rows="4" required value={formData.abstract}
                        onChange={e => setFormData({...formData, abstract: e.target.value})}
                        className="w-full p-2 border rounded focus:ring-1 focus:ring-blue-900"
                      ></textarea>
                    </div>

                    <button 
                      type="submit" 
                      disabled={isSendingEmail}
                      className="bg-blue-900 hover:bg-blue-800 text-white font-bold px-6 py-2 rounded transition shadow"
                    >
                      {isSendingEmail ? "Dispatching Submission..." : "Submit Paper"}
                    </button>
                  </form>
                </div>
              )}

              {/* View: Track Status */}
              {activeTab === 'track-manuscript' && (
                <div className="bg-white p-6 rounded-md shadow-sm border border-gray-200">
                  <h2 className="text-xl font-bold text-gray-900 border-b pb-3 mb-4">Track Manuscript</h2>
                  <div className="space-y-3">
                    {submissions.map(sub => (
                      <div key={sub.id} className="p-3 border rounded bg-gray-50 flex justify-between items-center">
                        <div>
                          <span className="text-[10px] font-bold bg-blue-900 text-white px-2 py-0.5 rounded">{sub.manuscript_id}</span>
                          <h4 className="text-xs font-bold mt-1">{sub.title}</h4>
                          <p className="text-[11px] text-gray-500">Author: {sub.author_name}</p>
                        </div>
                        <span className="text-xs font-bold bg-blue-100 text-blue-900 px-3 py-1 rounded">
                          {sub.status}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* View: Editor Control Dashboard */}
              {activeTab === 'editor-dashboard' && currentUser?.role === 'Editor' && (
                <div className="bg-white p-6 rounded-md shadow-sm border border-emerald-300">
                  <h2 className="text-xl font-bold text-emerald-950 border-b pb-3 mb-4">Editor Workflow Dashboard</h2>
                  <div className="space-y-3">
                    {submissions.map(sub => (
                      <div key={sub.id} className="p-3 border rounded flex justify-between items-center bg-gray-50">
                        <div>
                          <span className="text-xs font-bold text-blue-900">{sub.manuscript_id}</span>
                          <p className="text-xs font-bold">{sub.title}</p>
                          <p className="text-[11px] text-gray-500">{sub.author_email}</p>
                        </div>
                        <select 
                          value={sub.status}
                          onChange={(e) => updateStatus(sub.id, e.target.value)}
                          className="text-xs p-1 border rounded font-semibold bg-white"
                        >
                          <option>Submitted</option>
                          <option>Under Review</option>
                          <option>Revision Requested</option>
                          <option>Accepted</option>
                          <option>Rejected</option>
                          <option>Published</option>
                        </select>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* View: Standard Static Content (About/Scope/Ethics/Guidelines/APC/Timeline) */}
              {['about', 'aims-scope', 'ethics-policy', 'author-guidelines', 'apc-info', 'review-process'].includes(activeTab) && (
                <div className="bg-white p-6 rounded-md shadow-sm border border-gray-200 text-xs leading-relaxed space-y-3">
                  <h2 className="text-xl font-bold text-gray-900 border-b pb-2 capitalize">{activeTab.replace('-', ' ')}</h2>
                  <p>Journal of Integrative Science Development (JISD) is published bi-annually by the Research, Publication and Ethics Dissemination Directorate (RPEDD) at the University of Kabridahar, Ethiopia.</p>
                  <p>All submitted manuscripts are subjected to double-blind peer review. JISD levies zero publication fees or APCs for accepted works.</p>
                </div>
              )}

            </main>
          </div>

          {/* LOGIN MODAL */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-md shadow-xl w-full max-w-sm p-5">
                <h3 className="text-base font-bold text-gray-900 border-b pb-2 mb-3">Editor Access</h3>
                {loginError && <p className="text-xs text-red-600 mb-2">{loginError}</p>}
                <form onSubmit={handleLogin} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold mb-1">Email</label>
                    <input 
                      type="email" required value={loginEmail}
                      onChange={e => setLoginEmail(e.target.value)}
                      className="w-full p-2 border rounded" placeholder="mekuria.tsegaye20@uok.edu.et"
                    />
                  </div>
                  <div>
                    <label className="block font-bold mb-1">Password</label>
                    <input 
                      type="password" required value={loginPassword}
                      onChange={e => setLoginPassword(e.target.value)}
                      className="w-full p-2 border rounded" placeholder="••••••••"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowLoginModal(false)} className="px-3 py-1 text-gray-500">Cancel</button>
                    <button type="submit" className="bg-blue-900 text-white px-4 py-1.5 rounded font-bold">Log In</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-gray-900 text-gray-400 text-xs py-4 text-center mt-auto">
            <p>© {new Date().getFullYear()} Journal of Integrative Science Development (JISD) • University of Kabridahar</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
